<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hamo Sink Finder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      padding: 15px;
      background: linear-gradient(135deg, #1026a5, #a01616);
      color: #fff;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 18px;
      text-align: center;
      margin-bottom: 10px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }
    label {
      display: block;
      margin: 8px 0 4px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      border-radius: 5px;
      border: none;
      outline: none;
    }
    input[type="checkbox"] {
      margin-right: 6px;
    }
    button {
      margin-top: 10px;
      padding: 8px;
      width: 100%;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #save { background-color: #27ae60; color: #fff; }
    #save:hover { background-color: #1e8449; }
    #reset { background-color: #f39c12; color: #fff; }
    #reset:hover { background-color: #d68910; }
    #inject { background-color: #e74c3c; color: #fff; }
    #inject:hover { background-color: #c0392b; }
    .small { font-size: 12px; color: #ddd; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Hamo Sink Finder</h1>

  <label><input id="enabled" type="checkbox"> Enable instrumentation</label>
  <label class="small">When enabled, the content script will log / break when the test phrase is seen.</label>

  <label for="testPhrase">Test phrase</label>
  <input id="testPhrase" type="text" placeholder="e.g. ligma" />

  <label><input id="breakpoint" type="checkbox"> Trigger debugger on sinks</label>
  <label><input id="decodeBreakpoint" type="checkbox"> Trigger debugger on decode/parsing</label>

  <button id="save">Save & Apply</button>
  <button id="reset">Reset to defaults</button>
  <button id="inject">Inject content script to active tab</button>

  <script src="popup.js"></script>
</body>
</html>
